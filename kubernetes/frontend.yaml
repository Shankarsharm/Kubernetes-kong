---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-frontend
  namespace: ecommerce-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-frontend
  template:
    metadata:
      labels:
        app: fastapi-frontend
    spec:
      containers:
      - name: frontend
        image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: BACKEND_URL
          value: "http://backend-service.ecommerce-back.svc.cluster.local:8080"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ecommerce-front
spec:
  selector:
    app: fastapi-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: ecommerce-front
  annotations:
    kubernetes.io/ingress.class: kong
spec:
  rules:
  - host: www.my-ecommerce.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
