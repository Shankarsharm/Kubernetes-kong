---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-backend
  namespace: ecommerce-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-backend
  template:
    metadata:
      labels:
        app: springboot-backend
    spec:
      containers:
      - name: backend
        image: springio/gs-spring-boot-docker:latest
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC -Xss512k"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ecommerce-back
spec:
  selector:
    app: springboot-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: ecommerce-back
  annotations:
    kubernetes.io/ingress.class: kong
spec:
  rules:
  - host: api.my-ecommerce.local
    http:
      paths:
      - path: /api/v1/catalog
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      - path: /api/v1/orders
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
